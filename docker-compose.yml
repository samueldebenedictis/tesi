services:
  redis:
    image: redis:7-alpine
    ports:
      - 6379:6379

  app:
    image: node:lts-alpine3.23
    user: node
    ports:
      - 3000:3000
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - REDIS_URL=redis://redis:6379
      # Il container non ha una rotta IPv6 valida: senza questo, Node prova
      # prima gli indirizzi AAAA (es. fonts.googleapis.com) e la build si
      # blocca in timeout invece di ripiegare su IPv4.
      - NODE_OPTIONS=--dns-result-order=ipv4first
    depends_on:
      - redis
    command: sh -c "npm run vercel-build && npm run start"

  playwright:
    user: ubuntu
    image: mcr.microsoft.com/playwright:v1.58.0-noble
    volumes:
      - .:/app
    command: npx playwright test
    network_mode: host
    working_dir: /app

  storybook:
    image: node:lts-alpine3.23
    user: node
    ports:
      - 6006:6006
    volumes:
      - .:/app
    working_dir: /app
    command: sh -c "npm run storybook -- --ci"
